name: Ghost Girl Godot 4.7 smoke

on:
  pull_request:
    paths:
      - 'GhostGirl2/**'
      - '.github/workflows/ghostgirl-godot-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-and-boot:
    name: Godot 4.7 headless import, script parse and boot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Install Godot (no .NET required)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: false

      - name: Engine version
        run: godot --version

      - name: Validate v1.72.2 structure and references
        run: python3 GhostGirl2/tests/validate_v1722.py

      - name: Validate v1.72.3 Mythic and blade-only effects
        run: python3 GhostGirl2/tests/validate_v1723.py

      - name: Validate v1.73 dual daggers
        run: python3 GhostGirl2/tests/validate_v173.py

      - name: Validate v1.74 dual-sword equipment and animation references
        run: python3 GhostGirl2/tests/validate_v174.py

      - name: Validate v1.75 hook-free body, bow mirror and Mythic glows
        run: python3 GhostGirl2/tests/validate_v175.py

      - name: Import project resources
        run: godot --headless --editor --path GhostGirl2 --import

      - name: Compile weapon prestige FX script
        run: godot --headless --path GhostGirl2 --check-only --script res://scripts/weapon_prestige_fx.gd
      
      - name: Compile dual-dagger animation rig
        run: godot --headless --path GhostGirl2 --check-only --script res://scripts/v173_dual_daggers.gd

      - name: Compile both dual-dagger blade layers
        run: godot --headless --path GhostGirl2 --check-only --script res://scripts/v173_dual_dagger_blade.gd

      - name: Compile dual-sword animation rig
        run: godot --headless --path GhostGirl2 --check-only --script res://scripts/v174_dual_swords.gd

      - name: Compile both dual-sword blade layers
        run: godot --headless --path GhostGirl2 --check-only --script res://scripts/v174_dual_sword_blade.gd

      - name: Verify dual-sword animations on a real Godot player scene
        run: godot --headless --path GhostGirl2 --script res://tests/v174_animation_smoke.gd

      - name: Compile hook-free weapon animation installer
        run: godot --headless --path GhostGirl2 --check-only --script res://scripts/v175_hookfree_weapon_body.gd

      - name: Compile bow palette overlay with left mirror
        run: godot --headless --path GhostGirl2 --check-only --script res://scripts/bow_palette_overlay_v139.gd

      - name: Verify hook-free weapon frames and left bow mirror in Godot
        run: godot --headless --path GhostGirl2 --script res://tests/v175_hookfree_mirror_smoke.gd

      - name: Compile revised physical weapon pose renderer
        run: godot --headless --path GhostGirl2 --check-only --script res://scripts/v172_weapon_pose.gd

      - name: Verify v1.76 polearm thrust and Sanctum armory
        run: godot --headless --path GhostGirl2 --script res://tests/v176_polearm_smoke.gd

      - name: Validate independent collector appearance rolls
        run: godot --headless --path GhostGirl2 --script res://tests/v177_collector_smoke.gd

      - name: Validate modular physical weapon profiles
        run: godot --headless --path GhostGirl2 --script res://tests/v178_modular_smoke.gd

      - name: Verify collector inspection modal and item preservation
        run: godot --headless --path GhostGirl2 --script res://tests/v179_lens_smoke.gd

      - name: Verify preloaded core animation resource and repeatable installation
        run: godot --headless --path GhostGirl2 --script res://tests/v1791_core_animation_smoke.gd

      - name: Verify anomalous steel color modes and hand anchor regression
        run: godot --headless --path GhostGirl2 --script res://tests/v180_anomalous_smoke.gd

      - name: Verify actual inventory inspect button and twinblade assets
        run: godot --headless --path GhostGirl2 --script res://tests/v1801_twinblade_inspect_smoke.gd

      - name: Verify collection vault transfer and item protection
        run: godot --headless --path GhostGirl2 --script res://tests/v181_vault_smoke.gd

      - name: Verify Sanctum collection exhibition and persistent assignments
        run: godot --headless --path GhostGirl2 --script res://tests/v182_exhibition_smoke.gd

      - name: Verify regional weapon appearance and provenance
        run: godot --headless --path GhostGirl2 --script res://tests/v183_regional_smoke.gd

      - name: Load main scene for ten frames
        run: godot --headless --path GhostGirl2 --quit-after 10
