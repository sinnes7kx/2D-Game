name: Ghost Girl Godot checks (manual, budget-safe)

# No push/pull_request trigger: branch commits must not spend Actions credits.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Quick smoke or complete historical regression suite"
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: ghostgirl-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-equivalent-smoke:
    name: Godot 4.7 manual smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: false
      - name: Run chosen suite
        env:
          SUITE: ${{ inputs.suite }}
        run: bash GhostGirl2/tools/run_smoke_suite.sh "$SUITE"
